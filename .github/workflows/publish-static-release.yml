name: Publish static-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zip and force-push static-deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(release/b64/*)
          if [ ${#chunks[@]} -eq 0 ]; then
            echo "No release/b64 chunks yet; skip"
            exit 0
          fi
          cat "${chunks[@]}" > /tmp/voidwake-static.zip.b64
          python3 -c "from pathlib import Path; import base64; raw=b''.join(Path('/tmp/voidwake-static.zip.b64').read_bytes().split()); data=base64.b64decode(raw); Path('/tmp/voidwake-static.zip').write_bytes(data); print('decoded_bytes', len(data))"
          SIZE=$(wc -c < /tmp/voidwake-static.zip)
          echo "zip_size=$SIZE"
          if [ "$SIZE" -lt 700000 ]; then
            echo "Incomplete zip ($SIZE bytes); skip until all chunks are present"
            exit 0
          fi
          mkdir -p /tmp/static-out
          unzip -o /tmp/voidwake-static.zip -d /tmp/static-out
          test -f /tmp/static-out/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan static-deploy-tmp
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/static-out/. .
          printf '%s\n' '# Voidwake static export' '' 'Namecheap `public_html` build. `index.html` is at the repository root.' > README.md
          git add -A
          git status
          git commit -m "Publish static site to static-deploy"
          git branch -M static-deploy
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin static-deploy
