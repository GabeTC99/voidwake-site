name: Publish static zip release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zip and publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view static-v1 >/dev/null 2>&1; then
            echo "Release static-v1 already exists"
            exit 0
          fi
          cat release/voidwake-static.zip.b64.* > /tmp/voidwake-static.zip.b64
          base64 -d /tmp/voidwake-static.zip.b64 > voidwake-static.zip
          test "$(wc -c < voidwake-static.zip)" -eq 794749
          gh release create static-v1 voidwake-static.zip \
            --title "Static export v1" \
            --notes "Namecheap public_html static export of the Voidwake Studios site. Unzip with index.html at the document root."
